#
#  WPL17 CAN-B Scan Firmware (Diagnose) — NUR FUER ENTWICKLUNG/TESTING
#
#  Diese Konfiguration dient der Diagnose und dem Reverse-Engineering der WPL17
#  auf CAN-B (X1.2, 50 kbps). Sie ist KEINE Produktions-Konfiguration:
#  - aktiviert Diagnose-Logging (Can-Message-Requests, passive Sniffer)
#  - fragt gezielt einzelne Signale/Members ab, um unbekannte Register zu finden
#  - kann schreibende Tests auf der realen WP ausfuehren (Vorsicht!)
#
#  VERWENDUNG (mit ESPHome Device Builder):
#    1. Heatingpump.yaml + ggf. andere Modelle in den Addon-Ordner aus dem Ordner
#       Y:\esphome_disabled\ nehmen bzw. dort lassen, damit nur diese Kompiliert.
#    2. Diese Datei in den ESPHome-Ordner legen (z.B. neben heatingpump.yaml).
#    3. "firmware/compile" + "firmware/upload" im Device Builder.
#
#  Fuer die Produktion nutzt du stattdessen heatingpump.yaml mit device_model: wpl17
#  und sensors: !include ha-stiebel-control/wpl17.yaml
#
#  HINWEIS: Die Scan-Firmware kann die laufende WP beeinflussen (z.B.
#  PROGRAMMSCHALTER-Writes). Nur mit ausdruecklicher Freigabe und auf eigenes
#  Risiko verwenden.
#

substitutions:
  device_name: "stiebel-wp-scan"
  friendly_name: "Stiebel WP CAN Targeted Scan"
  can_tx_pin: "GPIO15"
  can_rx_pin: "GPIO16"
  can_id_pc: "0x680"
  can_bit_rate: "50kbps"            # WPL17 auf CAN-B nutzt 50 kbps (nicht 20)


esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

  on_boot:
    priority: 600
    then:
      - lambda: |-
          ESP_LOGI("scan", "=== CAN-B ENERGIE-SCAN: Energie-Register + Heizkurve ===");
          disableCanRequests = false;
      - delay: 3s
      - lambda: |-
          ESP_LOGI("scan", "==> Publiziere writable-Discoveries (inkl. HEIZKURVE)");
          publishAllWritableNumberDiscoveries(true);
          publishAllWritableSelectDiscoveries(true);
          publishAllCalculatedSensorDiscoveries(true);

  includes:
    - ha-stiebel-control/elster/ElsterTable.h
    - ha-stiebel-control/elster/KElsterTable.h
    - ha-stiebel-control/elster/NUtils.h
    - ha-stiebel-control/elster/NTypes.h
    - ha-stiebel-control/config.h
    - ha-stiebel-control/language_select.h
    - ha-stiebel-control/lang_base.h
    - ha-stiebel-control/signal_requests_base.h
    - ha-stiebel-control/sg_ready_controller.h
    - ha-stiebel-control/ha-stiebel-control.h

  platformio_options:
    build_flags:
      - '-DHA_DEVICE_MODEL="wpl17"'
      - '-DHA_LANGUAGE_DE'


wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: 192.168.179.60

  manual_ip:
    static_ip: 192.168.179.60
    gateway: 192.168.179.1
    subnet: 255.255.255.0

  ap:
    ssid: "Scan Fallback"
    password: "AsBl9n46jlOx"


captive_portal:


packages:
  board: !include ha-stiebel-control/board_esp32s3.yaml
  can: !include ha-stiebel-control/can_esp32.yaml
  base: !include ha-stiebel-control/common.yaml
  sensors: !include ha-stiebel-control/scan.yaml


logger:
  level: INFO
  baud_rate: 0


api:
  reboot_timeout: 15min
  encryption:
    key: !secret api_encryption_key


ota:
  - platform: esphome
    password: f0e6110663e3bef67846f076d7e4db81


safe_mode:
  reboot_timeout: 5min